/* ---------- Map Simulator ---------- */
const tileUrl = (theme) => theme === "dark"
  ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
  : "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png";

const markHtml = (s, i, state) =>
  '<div class="stepmark sd' + s.d + ' ' + state + '"><span class="em">' + s.icon + '</span><b>' + (i + 1) + '</b></div>';

const MapSim = ({ theme, step, setStep }) => {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);
  const markersRef = useRef([]);
  const lineRef = useRef(null);
  const cur = STEPS[step];

  const applyStep = (i, fly) => {
    const map = mapRef.current; if (!map) return;
    lineRef.current.setLatLngs(STEPS.slice(0, i + 1).map(s => s.coord));
    markersRef.current.forEach((m, j) => {
      const state = j === i ? "current" : (j < i ? "" : "future");
      m.setIcon(L.divIcon({ className: "", html: markHtml(STEPS[j], j, state), iconAnchor: [22, 14] }));
      m.setZIndexOffset(j === i ? 1000 : 0);
    });
    if (fly) map.flyTo(STEPS[i].coord, STEPS[i].z || 12, { duration: 0.9 });
  };

  useEffect(() => {
    const map = L.map(elRef.current, { scrollWheelZoom: true, tap: true });
    mapRef.current = map;
    layerRef.current = L.tileLayer(tileUrl(theme), {
      subdomains: "abcd", maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © CARTO'
    }).addTo(map);
    lineRef.current = L.polyline([], { color: "#f59e0b", weight: 3, opacity: 0.85, dashArray: "6 8" }).addTo(map);
    markersRef.current = STEPS.map((s, i) =>
      L.marker(s.coord, { icon: L.divIcon({ className: "", html: markHtml(s, i, "future"), iconAnchor: [22, 14] }) })
        .addTo(map).on("click", () => setStep(i))
    );
    map.setView(STEPS[step].coord, STEPS[step].z || 10);
    setTimeout(() => { map.invalidateSize(); applyStep(step, false); }, 80);
    return () => map.remove();
  }, []);

  useEffect(() => { if (layerRef.current) layerRef.current.setUrl(tileUrl(theme)); }, [theme]);
  useEffect(() => { applyStep(step, true); }, [step]);

  const fitAll = () => {
    const map = mapRef.current; if (!map) return;
    map.fitBounds(L.latLngBounds(STEPS.map(s => s.coord)).pad(0.12));
  };

  return (
    <div className="space-y-4 fade-in">
      <Glass className="p-4 md:p-5">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <div>
            <div className="font-bold text-lg md:text-xl">🗺️ จำลองการเดินทาง — กดดูทีละจุด</div>
            <div className="t-mut text-[13px] md:text-sm mt-0.5">กด "ถัดไป" เพื่อไล่เส้นทางทีละท่อน หรือจิ้ม marker บนแผนที่ได้เลย · พิกัดโดยประมาณ — นำทางจริงใช้ปุ่ม Google Maps</div>
          </div>
          <button onClick={fitAll} className="navbtn2 px-4 py-2.5 rounded-xl text-[13px] font-semibold">🔭 ดูทั้งเส้นทาง</button>
        </div>
        <div className="flex flex-wrap gap-x-4 gap-y-1.5 mt-3">
          {Object.keys(DAY_LABELS).map(d => (
            <span key={d} className="t-mut inline-flex items-center gap-1.5 text-[12px]">
              <span className="w-3 h-3 rounded-full inline-block" style={{ background: DAY_COLORS[d] }}></span>{DAY_LABELS[d]}
            </span>
          ))}
        </div>
      </Glass>

      <div className="grid lg:grid-cols-[1.45fr,1fr] gap-4 items-start">
        <Glass className="p-2 md:p-3">
          <div ref={elRef} className="w-full h-[380px] md:h-[520px] rounded-2xl overflow-hidden"></div>
        </Glass>

        <Glass className="p-5 lg:sticky lg:top-20">
          <div className="flex items-center justify-between gap-2">
            <Chip><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: DAY_COLORS[cur.d] }}></span> {DAY_LABELS[cur.d]}</Chip>
            <span className="t-dim text-[13px] tabular-nums">จุดที่ {step + 1} / {STEPS.length}</span>
          </div>
          <div className="battrack h-1.5 rounded-full overflow-hidden mt-3">
            <div className="h-full rounded-full bg-gradient-to-r from-amber-400 to-orange-500 transition-all duration-500" style={{ width: ((step + 1) / STEPS.length) * 100 + "%" }}></div>
          </div>
          <div className="flex items-start gap-3 mt-4">
            <div className="text-4xl md:text-5xl leading-none">{cur.icon}</div>
            <div className="min-w-0">
              <div className="t-gold font-semibold text-[14px] tabular-nums">{cur.t} น.</div>
              <div className="font-bold text-[17px] md:text-lg leading-snug">{cur.name}</div>
            </div>
          </div>
          <div className="t-mut text-[14.5px] md:text-[15px] leading-relaxed mt-2">{cur.desc}</div>
          <div className="flex flex-wrap gap-2 mt-3">
            {cur.km && <Chip>🚗 ~{cur.km} กม. จากจุดก่อนหน้า</Chip>}
            {cur.batt && <Chip className="t-emer">🔋 {cur.batt}</Chip>}
          </div>
          <div className="mt-3"><MapLink q={cur.maps} label="นำทางจริงด้วย Google Maps" /></div>
          <div className="grid grid-cols-2 gap-2.5 mt-5">
            <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0}
              className="navbtn2 h-12 rounded-2xl font-bold text-[15px]">◀ ก่อนหน้า</button>
            <button onClick={() => setStep(Math.min(STEPS.length - 1, step + 1))} disabled={step === STEPS.length - 1}

      </div>
    </div>
  );
};

    try { localStorage.setItem("tt-theme", mode); } catch (e) {}

      <Glass className="p-5 mt-6 text-[12.5px] t-dim leading-relaxed">
        <b style={{ color: "var(--muted)" }}>หมายเหตุ:</b> โรงแรมจองครบ 3 คืนแล้ว ✓ (ราคาจริงตามบุ๊กกิ้ง) ส่วนค่าชาร์จ/ร้าน/เวลาเปิดเป็น estimate ณ มิ.ย. 2569 — ก่อนเดินทาง:
        ① ไป 3–4 คน อย่าลืม Add A Room เพิ่มห้องที่ 2 ทั้ง 3 คืน ② เช็คเวลาเปิดคำชะโนด (เพจ Khamchanod Official — ปกติ 08:00–16:30 ไม่ต้องจองคิว)
        ③ เปิดแอปชาร์จเช็คตู้ว่างก่อนถึงทุกครั้ง ④ โรงแรม 3 เมือง = เก็บกระเป๋าทุกเช้า จัดกระเป๋าแบบหยิบง่ายไว้
        <div className="mt-2">🧭 TourLead — ไม่ใช่แค่บอกทาง แต่พาไปถึงที่หมาย · อัปเดต 11 มิ.ย. 2569</div>
      </Glass>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
